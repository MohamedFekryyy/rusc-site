# rūsc admin: the studio's back office (classes, codes…) and the codes API
# the booking page uses. See README.md. Secrets: DATABASE_URL (setup.sh) and
# CODES_ADMIN_PASSWORD (chosen by the studio).

app = "rusc-admin"
primary_region = "ams"

[build]
  dockerfile = "Dockerfile"

[env]
  # Sites allowed to call the API from the browser.
  ALLOWED_ORIGINS = "https://rusc-preview.vercel.app,https://studio-rusc.com,https://www.studio-rusc.com,http://localhost:3000,http://localhost:3001"
  # The studio's public site address, used in password-reset links.
  SITE_ORIGIN = "https://studio-rusc.com"

# Always on (about $2 a month): Stripe's webhook, the site's sign-in and code
# checks never wait for a cold start. Asleep, the first request took ~3 s.
[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "10s"
    interval = "60s"
    method = "GET"
    path = "/health"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
