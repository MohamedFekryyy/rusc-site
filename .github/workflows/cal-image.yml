# Builds the Cal.diy image for the rūsc booking server (deploy/cal/) from the
# calcom/cal.diy commit pinned in deploy/cal/CAL_DIY_REF, with our patches in
# deploy/cal/patches/ applied on top, and publishes it as
# ghcr.io/mohamedfekryyy/rusc-cal:<first 12 characters of that commit>-<first 8
# characters of the patches' sha256> (deploy/cal/deploy.sh computes the same tag).
#
# Cal.diy publishes no image of its own yet, and its build needs ~6 GB of
# memory, more than the booking server has. The build only uses Cal.diy's
# placeholder secrets; the real ones are Fly secrets (deploy/cal/README.md).
name: Cal.diy image

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - deploy/cal/CAL_DIY_REF
      - deploy/cal/patches/**

permissions:
  contents: read
  packages: write

concurrency:
  group: cal-image

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Read the pinned Cal.diy commit
        id: ref
        run: |
          sha=$(tr -d '[:space:]' < deploy/cal/CAL_DIY_REF)
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          patches=$(cat deploy/cal/patches/*.patch | sha256sum | cut -c1-8)
          echo "tag=$(echo "$sha" | cut -c1-12)-$patches" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          repository: calcom/cal.diy
          ref: ${{ steps.ref.outputs.sha }}
          path: cal.diy

      - name: Apply our patches
        run: |
          for patch in deploy/cal/patches/*.patch; do
            git -C cal.diy apply --verbose "$GITHUB_WORKSPACE/$patch"
          done

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Same build arguments as Cal.diy's own release workflow.
      - uses: docker/build-push-action@v6
        with:
          context: cal.diy
          file: cal.diy/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/mohamedfekryyy/rusc-cal:${{ steps.ref.outputs.tag }}
            ghcr.io/mohamedfekryyy/rusc-cal:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.ref.outputs.sha }}
            org.opencontainers.image.description=Cal.diy (calcom/cal.diy) for the rūsc booking server
          build-args: |
            NEXT_PUBLIC_WEBAPP_URL=http://localhost:3000
            NEXT_PUBLIC_API_V2_URL=http://localhost:5555/api/v2
            NEXT_PUBLIC_LICENSE_CONSENT=agree
            NEXT_PUBLIC_WEBSITE_TERMS_URL=https://studio-rusc.com/conditions/
            CALCOM_TELEMETRY_DISABLED=1
            DATABASE_URL=postgresql://cal:cal@localhost:5432/cal
